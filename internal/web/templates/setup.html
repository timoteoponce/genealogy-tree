{{template "header" .}}
<section class="loginbox">
  <h1>Welcome! Set up the first admin</h1>
  <p class="muted">There are no accounts yet — create the administrator that will
    manage users, imports and settings.</p>
  {{with .Error}}<p class="error">{{.}}</p>{{end}}
  <form method="post" action="/setup">
    <label>Username
      <input name="username" value="{{with .Username}}{{.}}{{end}}" autofocus autocomplete="username" required>
    </label>
    <label>Password <span class="muted">(min 8 characters)</span>
      <input name="password" type="password" autocomplete="new-password" required>
    </label>
    <label>Repeat password
      <input name="confirm" type="password" autocomplete="new-password" required>
    </label>
    <button type="submit">Create admin account</button>
  </form>
</section>
{{template "footer" .}}
