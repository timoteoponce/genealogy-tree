{{template "header" .}}
<section>
  <h1>{{t $.Lang "Settings"}}</h1>
  {{with .Error}}<p class="error">{{t $.Lang .}}</p>{{end}}
  {{with .Notice}}<p class="notice">{{t $.Lang .}}</p>{{end}}
  <form method="post" action="/admin/settings" class="formbox">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label>{{t $.Lang "Site name (shown in the top bar and titles)"}}
      <input name="site_name" value="{{index .Settings "site_name"}}" maxlength="60" required>
    </label>
    <button type="submit">{{t $.Lang "Save settings"}}</button>
  </form>
</section>
{{template "footer" .}}
